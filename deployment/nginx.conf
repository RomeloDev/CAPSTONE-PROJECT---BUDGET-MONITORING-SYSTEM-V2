# =============================================================================
# Nginx Configuration — Budget Monitoring System (On-Premise)
#
# Purpose:
#   Acts as a reverse proxy in front of Gunicorn.
#   Serves static and media files directly (bypassing Django).
#   Applies sensible security headers for a campus-network deployment.
#
# Prerequisites (Ubuntu / Debian server):
#   sudo apt install nginx
#   sudo cp deployment/nginx.conf /etc/nginx/sites-available/budget_system
#   sudo ln -s /etc/nginx/sites-available/budget_system /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every occurrence of:
#   YOUR_SERVER_IP   →  actual server IP or hostname (e.g. 192.168.1.100)
#   /path/to/app     →  absolute path where the project lives (e.g. /srv/budget_system)
# =============================================================================

upstream gunicorn_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name YOUR_SERVER_IP;

    # ── Client request limits ──────────────────────────────────────────────
    client_max_body_size 55M;       # Must be ≥ FILE_UPLOAD_MAX_MEMORY_SIZE in settings.py (50 MB)
    client_body_timeout  60s;
    client_header_timeout 30s;

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "same-origin"  always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # ── Static files (served directly by Nginx — zero Django overhead) ─────
    location /static/ {
        alias /path/to/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files (user-uploaded PDFs, images, Excel, etc.) ─────────────
    location /media/ {
        alias /path/to/app/media/;
        expires 7d;
        add_header Cache-Control "private";

        # Only allow known safe document types through Nginx.
        # Anything not matched falls through to Django (returns 404).
        location ~* \.(pdf|jpg|jpeg|png|gif|webp|xlsx|xls|docx|doc)$ {
            # Serve directly.
        }
    }

    # ── Application (proxy to Gunicorn) ───────────────────────────────────
    location / {
        proxy_pass         http://gunicorn_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";    # Enables keepalive to upstream

        proxy_connect_timeout  10s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;
    }

    # ── Deny access to hidden files (.env, .git, etc.) ───────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Custom error pages (optional but professional) ────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/budget_system_access.log;
    error_log  /var/log/nginx/budget_system_error.log warn;
}
